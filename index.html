<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিউজ কার্ড ও ভিডিও জেনারেটর</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --card-bg: #1f1f1f;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            outline: none;
        }

        input[type="file"] {
            color: #ccc;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: var(--primary);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
            border-radius: 8px;
            background: #000;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #333;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px; color: var(--primary);">Voice Of Rising Bangla - কার্ড ও ভিডিও জেনারেটর</h1>

    <div class="container">
        <!-- Input Controls -->
        <div class="panel">
            <h2>কন্টেন্ট ইনপুট</h2>
            
            <div class="form-group">
                <label for="category">ক্যাটাগরি / ট্যাগ:</label>
                <input type="text" id="category" value="জাতীয়" placeholder="যেমন: জাতীয়, খেলাধুলা, রাজনীতি">
            </div>

            <div class="form-group">
                <label for="headline">প্রধান শিরোনাম:</label>
                <textarea id="headline" rows="3" placeholder="সংবাদের মূল শিরোনাম লিখুন...">জরুরি সংবাদ: ফটো কার্ড জেনারেটর সিস্টেম তৈরি করা হয়েছে</textarea>
            </div>

            <div class="form-group">
                <label for="subhead">সাব-হেডলাইন / সংক্ষিপ্ত বিবরণ:</label>
                <input type="text" id="subhead" value="সহজেই সোশ্যাল মিডিয়ার জন্য ফটো ও ভিডিও কার্ড তৈরি করুন">
            </div>

            <div class="form-group">
                <label for="bgImage">সংবাদের ছবি (Image Upload):</label>
                <input type="file" id="bgImage" accept="image/*">
            </div>

            <div class="form-group">
                <label for="logoImage">লোগো (Logo Upload):</label>
                <input type="file" id="logoImage" accept="image/*">
            </div>

            <div class="form-group">
                <label for="bgAudio">ব্যাকগ্রাউন্ড অডিও (ভিডিওর জন্য):</label>
                <input type="file" id="bgAudio" accept="audio/*">
            </div>

            <div class="btn-group">
                <button onclick="renderCard()">ফটো কার্ড তৈরি করুন</button>
                <button onclick="downloadImage()" style="background: #28a745;">ছবি ডাউনলোড</button>
            </div>
            
            <div class="btn-group">
                <button onclick="playVideoPreview()" style="background: #17a2b8;">ভিডিও অ্যানিমেশন প্রিভিউ</button>
            </div>
        </div>

        <!-- Output Preview Panel -->
        <div class="panel preview-area">
            <h2>লাইভ প্রিভিউ</h2>
            <canvas id="cardCanvas" width="1080" height="1350"></canvas>
            <audio id="audioPlayer" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        let uploadedImg = null;
        let uploadedLogo = null;

        // Image Load Handlers
        document.getElementById('bgImage').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImg = new Image();
                uploadedImg.onload = renderCard;
                uploadedImg.src = event.target.result;
            }
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('logoImage').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedLogo = new Image();
                uploadedLogo.onload = renderCard;
                uploadedLogo.src = event.target.result;
            }
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        // Main Rendering Function for Photo Card
        function renderCard() {
            // Background Fill
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw News Image (Top portion)
            if (uploadedImg) {
                ctx.drawImage(uploadedImg, 0, 0, 1080, 800);
            } else {
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, 1080, 800);
                ctx.fillStyle = '#666';
                ctx.font = '40px Arial';
                ctx.fillText('ছবি আপলোড করুন', 400, 400);
            }

            // Bottom Gradient Overlay & Banner
            let gradient = ctx.createLinearGradient(0, 600, 0, 1350);
            gradient.addColorStop(0, 'rgba(0,0,0,0.1)');
            gradient.addColorStop(0.3, 'rgba(0,0,0,0.9)');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 500, 1080, 850);

            // Category Badge
            const category = document.getElementById('category').value;
            if(category) {
                ctx.fillStyle = '#e50914';
                ctx.fillRect(60, 780, 180, 45);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(category, 80, 810);
            }

            // Headline Text
            const headline = document.getElementById('headline').value;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px Arial';
            wrapText(ctx, headline, 60, 880, 960, 56);

            // Sub-headline Text
            const subhead = document.getElementById('subhead').value;
            ctx.fillStyle = '#cccccc';
            ctx.font = '28px Arial';
            wrapText(ctx, subhead, 60, 1100, 960, 38);

            // Footer / Branding Bar
            ctx.fillStyle = '#e50914';
            ctx.fillRect(0, 1270, 1080, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Arial';
            ctx.fillText('Voice Of Rising Bangla', 60, 1320);

            // Logo Overlay
            if(uploadedLogo) {
                ctx.drawImage(uploadedLogo, 920, 1280, 100, 60);
            }
        }

        // Text Wrapping Helper
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        // Download Image Function
        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'news-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Simple Canvas Video Preview Animation
        let animFrame;
        function playVideoPreview() {
            let zoom = 1.0;
            let step = 0;
            
            // Audio play if uploaded
            const audioInput = document.getElementById('bgAudio');
            const audioPlayer = document.getElementById('audioPlayer');
            if(audioInput.files[0]) {
                audioPlayer.src = URL.createObjectURL(audioInput.files[0]);
                audioPlayer.style.display = 'block';
                audioPlayer.play();
            }

            function animate() {
                step++;
                zoom += 0.0005; // Slow zoom-in effect for photo
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw Zooming Image
                if (uploadedImg) {
                    ctx.save();
                    ctx.scale(zoom, zoom);
                    ctx.drawImage(uploadedImg, 0, 0, 1080, 800);
                    ctx.restore();
                }

                // Render text & template on top
                renderCard();

                if(step < 300) { // Runs preview for ~5 seconds
                    animFrame = requestAnimationFrame(animate);
                }
            }
            cancelAnimationFrame(animFrame);
            animate();
        }

        // Initial Render
        renderCard();
    </script>
</body>
</html>
