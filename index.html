<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Wing - Multi-Style Photo Card Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-amber-400">Media Wing Photo Generator</h1>
            <p class="text-slate-400 text-sm">আপনার পছন্দের ডিজাইন সিলেক্ট করে কার্ড তৈরি করুন</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Controls Form -->
            <div class="bg-slate-800 p-4 sm:p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-amber-300 border-b border-slate-700 pb-2">কার্ডের ডিজাইন ও তথ্য</h2>
                
                <!-- Template Selector -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">টেমপ্লেট স্টাইল নির্বাচন করুন</label>
                    <select id="templateSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm font-medium">
                        <option value="style1">স্টাইল ১: ইভেন্ট ও ফ্রেম কার্ড (১ম ছবির মতো)</option>
                        <option value="style2">স্টাইল ২: নেতা ও শিরোনাম কার্ড (২য় ছবির মতো)</option>
                        <option value="style3">স্টাইল ৩: বিবৃতি / বক্তব্য কার্ড (৩য় ছবির মতো)</option>
                    </select>
                </div>

                <!-- Main Text / Headline -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" id="titleLabel">প্রধান শিরোনাম / মূল বার্তা</label>
                    <textarea id="titleInput" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">ফের আলোচনায় এমপি অলিউল্লাহ, কেন বারবার টার্গেটের শিকার হচ্ছেন তিনি?</textarea>
                </div>

                <!-- Subtitle / Speaker Info -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" id="extraLabel">বক্তার নাম ও পদবি / বিবরণ</label>
                    <textarea id="subtitleInput" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">মিয়া গোলাম পরওয়ার - সেক্রেটারি জেনারেল, বাংলাদেশ জামায়াতে ইসলামী</textarea>
                </div>

                <!-- Date & Footer -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">তারিখ</label>
                        <input type="text" id="dateInput" value="১৫ নভেম্বর ২০২৬" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">ফুটর / ক্যাপশন টেক্সট</label>
                        <input type="text" id="footerInput" value="< বিস্তারিতঃ ক্যাপশনে >" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                </div>

                <!-- Logo Upload -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">লোগো / মনোগ্রাম (স্থায়ীভাবে সংরক্ষিত)</label>
                    <input type="file" id="logoUpload" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
                </div>

                <!-- Main Subject / Event Photo Upload -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">মূল ছবি (ইভেন্ট বা নেতার ছবি)</label>
                    <input type="file" id="newsPhotoUpload" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-500 file:text-slate-950 hover:file:bg-sky-400 cursor-pointer">
                </div>

                <!-- Download Button -->
                <button id="downloadBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-lg transition shadow-md cursor-pointer mt-2">
                    ফটো কার্ড ডাউনলোড করুন (PNG)
                </button>
            </div>

            <!-- Live Preview -->
            <div class="flex flex-col items-center justify-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-sm font-medium text-slate-400 mb-3">লাইভ প্রিভিউ</h2>
                <div class="w-full max-w-[360px] aspect-square shadow-2xl rounded-lg overflow-hidden border border-slate-700">
                    <canvas id="photoCanvas" width="1080" height="1080" class="w-full h-full object-contain"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');

        const templateSelect = document.getElementById('templateSelect');
        const titleInput = document.getElementById('titleInput');
        const subtitleInput = document.getElementById('subtitleInput');
        const dateInput = document.getElementById('dateInput');
        const footerInput = document.getElementById('footerInput');
        const logoUpload = document.getElementById('logoUpload');
        const newsPhotoUpload = document.getElementById('newsPhotoUpload');
        const downloadBtn = document.getElementById('downloadBtn');
        const titleLabel = document.getElementById('titleLabel');
        const extraLabel = document.getElementById('extraLabel');

        let logoImage = null;
        let newsImage = null;

        // Load saved logo from localStorage
        const savedLogo = localStorage.getItem('media_wing_logo');
        if (savedLogo) {
            logoImage = new Image();
            logoImage.src = savedLogo;
            logoImage.onload = () => drawCard();
        } else {
            drawCard();
        }

        logoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    localStorage.setItem('media_wing_logo', event.target.result);
                    logoImage = new Image();
                    logoImage.src = event.target.result;
                    logoImage.onload = () => drawCard();
                };
                reader.readAsDataURL(file);
            }
        });

        newsPhotoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    newsImage = new Image();
                    newsImage.src = event.target.result;
                    newsImage.onload = () => drawCard();
                };
                reader.readAsDataURL(file);
            }
        });

        templateSelect.addEventListener('change', function() {
            const val = this.value;
            if (val === 'style2') {
                titleLabel.innerText = 'প্রধান শিরোনাম';
                extraLabel.innerText = 'বক্তার নাম ও পদবি (নিচে বাঁয়ে দেখাবে)';
            } else if (val === 'style3') {
                titleLabel.innerText = 'মূল বিবৃতি বা বক্তব্য';
                extraLabel.innerText = 'নেতার নাম ও পদবি';
            } else {
                titleLabel.innerText = 'প্রধান শিরোনাম / মূল বার্তা';
                extraLabel.innerText = 'ছোট বিবরণ বা সাবটাইটেল';
            }
            drawCard();
        });

        [titleInput, subtitleInput, dateInput, footerInput].forEach(input => {
            input.addEventListener('input', drawCard);
        });

        function drawMultiLineText(context, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let currentY = y;
            for (let p = 0; p < paragraphs.length; p++) {
                currentY = drawParagraph(context, paragraphs[p], x, currentY, maxWidth, lineHeight);
            }
            return currentY;
        }

        function drawParagraph(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            if (text.trim() === '') return currentY + lineHeight;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
            return currentY + lineHeight;
        }

        function drawCard() {
            const template = templateSelect.value;
            if (template === 'style1') {
                drawStyle1Card();
            } else if (template === 'style2') {
                drawStyle2Card();
            } else {
                drawStyle3Card();
            }
        }

        // Style 1: Event & Frame Card (1st Image format)
        function drawStyle1Card() {
            // Background gradient (Deep Purple/Slate)
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#2e1065');
            bgGrad.addColorStop(0.5, '#1e1b4b');
            bgGrad.addColorStop(1, '#09090b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Date on top right
            ctx.fillStyle = '#ffffff';
            ctx.font = '32px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('তারিখ: ' + dateInput.value, 1020, 80);
            ctx.textAlign = 'left';

            // Top Logo / Emblem area
            if (logoImage) {
                ctx.drawImage(logoImage, 465, 20, 150, 150);
            } else {
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.arc(540, 95, 70, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "Hind Siliguri", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LOGO', 540, 103);
                ctx.textAlign = 'left';
            }

            // Central Photo Frame with Yellow/Gold Border
            const frameX = 90;
            const frameY = 190;
            const frameW = 900;
            const frameH = 500;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(frameX - 6, frameY - 6, frameW + 12, frameH + 12);

            if (newsImage) {
                ctx.drawImage(newsImage, frameX, frameY, frameW, frameH);
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(frameX, frameY, frameW, frameH);
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 36px "Hind Siliguri", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ইভেন্ট বা খবরের ছবি এখানে থাকবে', 540, frameY + 260);
                ctx.textAlign = 'left';
            }

            // Main Title below frame
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            drawMultiLineText(ctx, titleInput.value, 540, 750, 960, 62);
            ctx.textAlign = 'left';

            // Footer bar
            ctx.fillStyle = '#18181b';
            ctx.fillRect(0, 980, 1080, 100);

            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 32px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(footerInput.value, 540, 1040);
            ctx.textAlign = 'left';
        }

        // Style 2: Leader & Headline Card (2nd Image format)
        function drawStyle2Card() {
            // Background gradient (Deep Green)
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#064e3b');
            bgGrad.addColorStop(1, '#022c22');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Top Center Logo
            if (logoImage) {
                ctx.drawImage(logoImage, 465, 30, 150, 100);
            } else {
                ctx.fillStyle = '#10b981';
                ctx.fillRect(440, 30, 200, 80);
                ctx.fillStyle = '#022c22';
                ctx.font = 'bold 28px "Hind Siliguri", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('MEDIA WING', 540, 80);
                ctx.textAlign = 'left';
            }

            // Main Title at top
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 56px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            drawMultiLineText(ctx, titleInput.value, 540, 170, 960, 74);
            ctx.textAlign = 'left';

            // Speaker Info Box on Bottom Left
            ctx.fillStyle = 'rgba(2, 44, 34, 0.9)';
            ctx.beginPath();
            ctx.roundRect(60, 850, 480, 160, 16);
            ctx.fill();

            const subParts = subtitleInput.value.split('-');
            const namePart = subParts[0] ? subParts[0].trim() : subtitleInput.value;
            const titlePart = subParts[1] ? subParts[1].trim() : '';

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 38px "Hind Siliguri", sans-serif';
            ctx.fillText(namePart, 90, 915);

            ctx.fillStyle = '#34d399';
            ctx.font = '26px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, titlePart, 90, 955, 430, 34);

            // Leader Photo on Bottom Right
            if (newsImage) {
                ctx.drawImage(newsImage, 560, 450, 520, 630);
            }
        }

        // Style 3: Statement / Quote Card (3rd Image format)
        function drawStyle3Card() {
            // Background gradient (Deep Green/Dark)
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#064e3b');
            bgGrad.addColorStop(0.5, '#042f2e');
            bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Top Center Logo Badge
            if (logoImage) {
                ctx.drawImage(logoImage, 465, 30, 150, 110);
            } else {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.roundRect(430, 30, 220, 90, 12);
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 26px "Hind Siliguri", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('MEDIA WING', 540, 85);
                ctx.textAlign = 'left';
            }

            // Statement / Headline in Middle
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            drawMultiLineText(ctx, titleInput.value, 540, 180, 960, 68);
            ctx.textAlign = 'left';

            // Divider Line
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(150, 560);
            ctx.lineTo(930, 560);
            ctx.stroke();

            // Speaker Name & Designation below statement (Centered)
            const subParts = subtitleInput.value.split('-');
            const namePart = subParts[0] ? subParts[0].trim() : subtitleInput.value;
            const titlePart = subParts[1] ? subParts[1].trim() : '';

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 44px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(namePart, 540, 630);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '30px "Hind Siliguri", sans-serif';
            ctx.fillText(titlePart, 540, 675);
            ctx.textAlign = 'left';

            // Date on Bottom Left
            ctx.fillStyle = '#f59e0b';
            ctx.font = '28px "Hind Siliguri", sans-serif';
            ctx.fillText(dateInput.value, 60, 1030);

            // Speaker Photo at Bottom Right
            if (newsImage) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(880, 840, 180, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(newsImage, 700, 660, 360, 360);
                ctx.restore();

                // Gold border ring around speaker photo
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(880, 840, 180, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Download Action
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'media-wing-card-' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
