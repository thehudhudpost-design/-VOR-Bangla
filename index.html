<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল নিউজ ফটো কার্ড জেনারেটর</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Hind Siliguri -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas for image download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-y-screen pb-12">

    <div class="max-w-md mx-auto p-4">
        <header class="text-center my-4">
            <h1 class="text-xl font-bold text-slate-800">নিউজ ফটো কার্ড মেকার</h1>
            <p class="text-xs text-slate-500">আপনার পছন্দমতো নিউজ কার্ড তৈরি করুন ও ডাউনলোড করুন</p>
        </header>

        <!-- PREVIEW CARD SECTION -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-6 border border-slate-200">
            <div id="photoCard" class="w-full bg-[#0b2721] text-white flex flex-col relative overflow-hidden transition-all duration-300">
                
                <!-- Facebook Header -->
                <div class="bg-white text-slate-900 px-4 py-3 flex items-center justify-between border-b border-slate-100">
                    <div class="flex items-center space-x-3">
                        <img id="previewLogo" src="https://via.placeholder.com/40" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-slate-300">
                        <div>
                            <h3 id="displayPageName" class="font-bold text-sm leading-tight text-slate-900">ICAB Media Wing</h3>
                            <div class="flex items-center space-x-1 text-[11px] text-slate-500">
                                <span id="displayDate">৩১ অক্টোবর</span>
                                <span>•</span>
                                <!-- Globe Icon -->
                                <svg class="w-3 h-3 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main News Image Container -->
                <div class="relative w-full aspect-[4/3] bg-slate-900 overflow-hidden">
                    <img id="previewImage" src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=800&q=80" alt="News Image" class="w-full h-full object-cover">
                    
                    <!-- Top-Right Watermark / Small Logo -->
                    <div class="absolute top-3 right-3 bg-black/40 backdrop-blur-md p-1.5 rounded-full border border-white/20">
                        <img id="previewWatermark" src="https://via.placeholder.com/30" class="w-7 h-7 rounded-full object-cover">
                    </div>
                </div>

                <!-- Content Panel -->
                <div id="cardThemeBg" class="p-5 flex flex-col justify-between flex-grow bg-gradient-to-b from-[#0b2721] to-[#061814]">
                    
                    <!-- Headline -->
                    <h2 id="displayHeadline" class="text-lg sm:text-xl font-bold leading-snug text-white mb-4 text-center">
                        ট্রান্সজেন্ডার ইস্যু নিয়ে শিক্ষামন্ত্রীকে সতর্ক বার্তা
                    </h2>

                    <!-- Optional Name & Designation Box (Hidden if empty) -->
                    <div id="authorBox" class="text-center pt-3 border-t border-white/15">
                        <h4 id="displayName" class="text-amber-400 font-bold text-base leading-tight">মুফতি সৈয়দ ফয়জুল করীম</h4>
                        <p id="displayDesig" class="text-slate-300 text-xs mt-0.5">সিনিয়র নায়েবে আমীর, ইসলামী আন্দোলন বাংলাদেশ</p>
                    </div>

                </div>

            </div>
        </div>

        <!-- CONTROLS & INPUTS FORM -->
        <div class="bg-white rounded-2xl shadow-sm p-4 space-y-4 border border-slate-200">
            <h2 class="font-semibold text-slate-700 text-sm border-b pb-2">তথ্য ও কাস্টমাইজেশন</h2>

            <!-- Theme Selector -->
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">কার্ড থিম কালার</label>
                <select id="themeSelector" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="#0b2721">ডার্ক গ্রিন (সবুজ)</option>
                    <option value="#1e293b">নেভি ব্লু (নীল)</option>
                    <option value="#581c87">ডিপ পার্পল</option>
                    <option value="#7f1d1d">মেরুন রেড (লাল)</option>
                </select>
            </div>

            <!-- Page Name & Date -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">পেজের নাম</label>
                    <input type="text" id="inputPageName" value="ICAB Media Wing" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">তারিখ</label>
                    <input type="text" id="inputDate" value="৩১ অক্টোবর" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none">
                </div>
            </div>

            <!-- Logo & Image Uploads -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">লোগো আপলোড</label>
                    <input type="file" id="inputLogo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">প্রধান ছবি আপলোড</label>
                    <input type="file" id="inputImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                </div>
            </div>

            <!-- Headline Input -->
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">মূল শিরোনাম</label>
                <textarea id="inputHeadline" rows="2" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none">ট্রান্সজেন্ডার ইস্যু নিয়ে শিক্ষামন্ত্রীকে সতর্ক বার্তা</textarea>
            </div>

            <!-- Optional Name & Designation -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">নাম (ঐচ্ছিক)</label>
                    <input type="text" id="inputName" value="মুফতি সৈয়দ ফয়জুল করীম" placeholder="খালি রাখা যাবে" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">পদবী (ঐচ্ছিক)</label>
                    <input type="text" id="inputDesig" value="সিনিয়র নায়েবে আমীর, ইসলামী আন্দোলন বাংলাদেশ" placeholder="খালি রাখা যাবে" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none">
                </div>
            </div>

            <!-- Download Button -->
            <button id="downloadBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>হাই-কোয়ালিটি ছবি ডাউনলোড করুন</span>
            </button>
        </div>
    </div>

    <!-- Script to handle live preview and download -->
    <script>
        const inputPageName = document.getElementById('inputPageName');
        const inputDate = document.getElementById('inputDate');
        const inputHeadline = document.getElementById('inputHeadline');
        const inputName = document.getElementById('inputName');
        const inputDesig = document.getElementById('inputDesig');
        const themeSelector = document.getElementById('themeSelector');

        const displayPageName = document.getElementById('displayPageName');
        const displayDate = document.getElementById('displayDate');
        const displayHeadline = document.getElementById('displayHeadline');
        const displayName = document.getElementById('displayName');
        const displayDesig = document.getElementById('displayDesig');
        const authorBox = document.getElementById('authorBox');
        const cardThemeBg = document.getElementById('cardThemeBg');

        // Live text update handlers
        inputPageName.addEventListener('input', (e) => displayPageName.innerText = e.target.value);
        inputDate.addEventListener('input', (e) => displayDate.innerText = e.target.value);
        inputHeadline.addEventListener('input', (e) => displayHeadline.innerText = e.target.value);

        function updateAuthorBox() {
            const nameVal = inputName.value.trim();
            const desigVal = inputDesig.value.trim();

            if(nameVal === '' && desigVal === '') {
                authorBox.style.display = 'none';
            } else {
                authorBox.style.display = 'block';
                displayName.innerText = nameVal;
                displayDesig.innerText = desigVal;
                displayName.style.display = nameVal ? 'block' : 'none';
                displayDesig.style.display = desigVal ? 'block' : 'none';
            }
        }

        inputName.addEventListener('input', updateAuthorBox);
        inputDesig.addEventListener('input', updateAuthorBox);

        // Theme change handler
        themeSelector.addEventListener('change', (e) => {
            const color = e.target.value;
            cardThemeBg.style.background = `linear-gradient(to bottom, ${color}, #050f0d)`;
        });

        // Image upload handler
        document.getElementById('inputImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('previewImage').src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Logo upload handler
        document.getElementById('inputLogo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('previewLogo').src = event.target.result;
                    document.getElementById('previewWatermark').src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Download as PNG
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const card = document.getElementById('photoCard');
            html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'news-photo-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
