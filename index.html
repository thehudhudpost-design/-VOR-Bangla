<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Photo Card Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js for reactive state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- html2canvas for downloading card as PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts: Hind Siliguri for authentic Bengali typography -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { bengali: ['Hind Siliguri', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Hind Siliguri', sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-full flex flex-col antialiased" x-data="cardApp()">

    <!-- Toast Notification -->
    <div class="fixed top-5 right-5 z-50 transition-all duration-300 transform" x-show="toast.show" x-transition x-cloak>
        <div class="flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-white font-medium bg-emerald-600">
            <i class="fas fa-check-circle"></i>
            <span x-text="toast.message"></span>
        </div>
    </div>

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-40 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-700 to-teal-600 flex items-center justify-center text-white shadow-md">
                <i class="fas fa-newspaper text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-base leading-tight">নিউজ ফটো কার্ড জেনারেটর</h1>
                <p class="text-[11px] text-slate-500 font-medium">Professional News Social Card Builder</p>
            </div>
        </div>
        <button @click="downloadCard()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl shadow-md text-xs flex items-center gap-2 transition active:scale-95">
            <i class="fas fa-download"></i> Download PNG
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- PREVIEW SECTION (Sticky or Top on mobile) -->
        <div class="lg:col-span-6 flex flex-col items-center justify-center lg:sticky lg:top-20">
            <div class="w-full max-w-[480px]">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Live Preview (1:1 Square)</span>
                    <span class="text-xs text-emerald-600 font-semibold bg-emerald-50 px-2 py-0.5 rounded-md">HD Ready</span>
                </div>

                <!-- THE ACTUAL CARD TO EXPORT -->
                <div id="captureCard" class="w-full aspect-square relative overflow-hidden shadow-2xl flex flex-col font-bengali select-none rounded-2xl lg:rounded-3xl border border-slate-200" :style="currentTheme.bgGradient">
                    
                    <!-- Top News Photo Area (approx 55% height) -->
                    <div class="w-full h-[58%] relative overflow-hidden bg-slate-900">
                        <img :src="photoUrl" alt="News Image" class="w-full h-full object-cover">
                        <!-- Gradient overlay for smooth blend -->
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent"></div>
                        
                        <!-- Top-Right Logo / Watermark -->
                        <div class="absolute top-3 right-3 bg-white/95 backdrop-blur-md p-1 rounded-full shadow-lg border border-white/20 flex items-center justify-center w-12 h-12 overflow-hidden">
                            <img :src="logoUrl" alt="Logo" class="w-full h-full object-cover rounded-full">
                        </div>
                    </div>

                    <!-- Bottom Content Panel -->
                    <div class="w-full h-[42%] px-6 py-4 flex flex-col justify-between relative" :style="currentTheme.panelBg">
                        <!-- Decorative Top Glow Line -->
                        <div class="absolute top-0 left-0 right-0 h-1" :style="currentTheme.accentBar"></div>

                        <!-- Headline Area -->
                        <div>
                            <h2 class="text-white font-bold text-lg sm:text-xl leading-snug tracking-tight line-clamp-3" x-text="headline"></h2>
                        </div>

                        <!-- Divider Ornament -->
                        <div class="flex items-center justify-center gap-2 my-1 opacity-70">
                            <div class="w-8 h-[1px]" :style="currentTheme.accentBg"></div>
                            <div class="w-1.5 h-1.5 rounded-full" :style="currentTheme.accentBg"></div>
                            <div class="w-8 h-[1px]" :style="currentTheme.accentBg"></div>
                        </div>

                        <!-- Speaker & Designation Area -->
                        <div class="text-center pb-1">
                            <h3 class="font-bold text-base sm:text-lg leading-tight" :style="currentTheme.speakerColor" x-text="speakerName"></h3>
                            <p class="text-xs sm:text-sm font-medium text-slate-200 mt-0.5 opacity-90 line-clamp-1" x-text="designation"></p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- CONTROLS & FORM SECTION -->
        <div class="lg:col-span-6 space-y-5">
            
            <!-- Theme Selector -->
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                    <i class="fas fa-palette text-emerald-600"></i> থিম ও কালার স্টাইল (Theme)
                </h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    <template x-for="theme in themes" :key="theme.id">
                        <button @click="selectedTheme = theme.id" 
                            :class="selectedTheme === theme.id ? 'ring-2 ring-emerald-600 ring-offset-2 border-transparent' : 'border-slate-200'" 
                            class="p-3 rounded-2xl border text-left transition flex flex-col gap-2 bg-slate-50 hover:bg-slate-100">
                            <div class="w-full h-6 rounded-lg shadow-inner" :style="theme.previewStyle"></div>
                            <span class="text-xs font-bold text-slate-700" x-text="theme.name"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Image & Logo Uploads -->
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                    <i class="fas fa-image text-emerald-600"></i> ছবি ও লোগো আপলোড
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">নিউজ ফটো (News Photo)</label>
                        <input type="file" accept="image/*" @change="handlePhotoUpload" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">লোগো / ওয়াটারমার্ক (Logo)</label>
                        <input type="file" accept="image/*" @change="handleLogoUpload" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Text & Headline Inputs -->
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                    <i class="fas fa-pen-nib text-emerald-600"></i> খবরের বিবরণ ও বক্তব্য
                </h3>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">মূল শিরোনাম (Headline)</label>
                    <textarea rows="3" x-model="headline" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 transition resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">বক্তা / ব্যক্তির নাম (Speaker)</label>
                        <input type="text" x-model="speakerName" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">পদবী / পরিচয় (Designation)</label>
                        <input type="text" x-model="designation" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>
            </div>

            <!-- Download Button (Bottom) -->
            <button @click="downloadCard()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-xl shadow-emerald-600/20 transition flex items-center justify-center gap-2 text-base">
                <i class="fas fa-cloud-arrow-down text-lg"></i> ফটো কার্ড ডাউনলোড করুন (PNG)
            </button>

        </div>

    </main>

    <!-- Application Script -->
    <script>
        function cardApp() {
            return {
                headline: 'ট্রান্সজেন্ডার ইস্যু নিয়ে শিক্ষামন্ত্রীকে সতর্ক বার্তা',
                speakerName: 'মুফতি সৈয়দ ফয়জুল করীম',
                designation: 'সিনিয়র নায়েবে আমীর, ইসলামী আন্দোলন বাংলাদেশ',
                photoUrl: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=1000&q=80',
                logoUrl: 'https://placehold.co/150x150/064e3b/ffffff?text=LOGO',
                
                selectedTheme: 'darkgreen',
                toast: { show: false, message: '' },

                showToast(msg) {
                    this.toast = { show: true, message: msg };
                    setTimeout(() => { this.toast.show = false; }, 3000);
                },

                themes: [
                    {
                        id: 'darkgreen',
                        name: 'ডিপ গ্রিন',
                        previewStyle: 'background: linear-gradient(135deg, #022c22, #064e3b);',
                        bgGradient: 'background-color: #022c22;',
                        panelBg: 'background: linear-gradient(to bottom, #064e3b, #022c22);',
                        accentBar: 'background: linear-gradient(90deg, #10b981, #f59e0b, #10b981);',
                        accentBg: 'background-color: #f59e0b;',
                        speakerColor: 'color: #fde047;'
                    },
                    {
                        id: 'navy',
                        name: 'নেভি ব্লু',
                        previewStyle: 'background: linear-gradient(135deg, #0f172a, #1e3a8a);',
                        bgGradient: 'background-color: #0f172a;',
                        panelBg: 'background: linear-gradient(to bottom, #1e3a8a, #0f172a);',
                        accentBar: 'background: linear-gradient(90deg, #38bdf8, #fbbf24, #38bdf8);',
                        accentBg: 'background-color: #fbbf24;',
                        speakerColor: 'color: #fef08a;'
                    },
                    {
                        id: 'maroon',
                        name: 'মেরুন রেড',
                        previewStyle: 'background: linear-gradient(135deg, #450a0a, #7f1d1d);',
                        bgGradient: 'background-color: #450a0a;',
                        panelBg: 'background: linear-gradient(to bottom, #7f1d1d, #450a0a);',
                        accentBar: 'background: linear-gradient(90deg, #f87171, #fde047, #f87171);',
                        accentBg: 'background-color: #fde047;',
                        speakerColor: 'color: #fef08a;'
                    },
                    {
                        id: 'charcoal',
                        name: 'চারকোল ব্ল্যাক',
                        previewStyle: 'background: linear-gradient(135deg, #09090b, #27272a);',
                        bgGradient: 'background-color: #09090b;',
                        panelBg: 'background: linear-gradient(to bottom, #27272a, #09090b);',
                        accentBar: 'background: linear-gradient(90deg, #a1a1aa, #facc15, #a1a1aa);',
                        accentBg: 'background-color: #facc15;',
                        speakerColor: 'color: #fef08a;'
                    }
                ],

                get currentTheme() {
                    return this.themes.find(t => t.id === this.selectedTheme) || this.themes[0];
                },

                handlePhotoUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => { this.photoUrl = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                handleLogoUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => { this.logoUrl = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                downloadCard() {
                    const element = document.getElementById('captureCard');
                    this.showToast('ফটো কার্ড তৈরি হচ্ছে...');
                    
                    html2canvas(element, {
                        scale: 3, // High resolution export
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: null
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'news-photo-card.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        this.showToast('সফলভাবে ডাউনলোড হয়েছে!');
                    }).catch(err => {
                        console.err(err);
                        this.showToast('ডাউনলোড করতে সমস্যা হয়েছে');
                    });
                }
            }
        }
    </script>
</body>
</html>
