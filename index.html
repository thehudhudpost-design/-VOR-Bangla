<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICAB Media Wing - Multi-Template Photo Card Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts for Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-amber-400">ICAB Media Wing</h1>
            <p class="text-slate-400 text-sm">মাল্টি-টেমপ্লেট ফটো কার্ড জেনারেটর</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Controls Form -->
            <div class="bg-slate-800 p-4 sm:p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-amber-300 border-b border-slate-700 pb-2">কার্ডের ধরন ও তথ্য</h2>
                
                <!-- Template Selector -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">টেমপ্লেট নির্বাচন করুন</label>
                    <select id="templateSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm font-medium">
                        <option value="press">প্রেস বিজ্ঞপ্তি (Standard Press Release)</option>
                        <option value="breaking">জরুরি সংবাদ / ব্রেকিং নিউজ (Breaking News)</option>
                        <option value="quote">উক্তি / বাণী কার্ড (Quote Card)</option>
                        <option value="notice">সাধারণ নোটিশ / ইভেন্ট (Notice & Event)</option>
                    </select>
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">ক্যাটাগরি / ট্যাগ</label>
                    <input type="text" id="categoryInput" value="প্রেস বিজ্ঞপ্তি" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                </div>

                <!-- Headline / Main Text -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" id="titleLabel">প্রধান শিরোনাম / মূল বার্তা</label>
                    <textarea id="titleInput" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">এখানে আপনার শিরোনাম বা মূল বার্তা লিখুন...</textarea>
                </div>

                <!-- Subtitle / Speaker Name -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" id="extraLabel">ছোট বিবরণ বা হাইলাইট</label>
                    <textarea id="subtitleInput" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">আইসিএবি মিডিয়া উইং আপডেট</textarea>
                </div>

                <!-- Date & Footer -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">তারিখ</label>
                        <input type="text" id="dateInput" value="১৭ নভেম্বর ২০২৬" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">ফুটর টেক্সট</label>
                        <input type="text" id="footerInput" value="ICAB Media Wing" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                    </div>
                </div>

                <!-- Logo Upload -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">লোগো আপলোড (স্থায়ীভাবে সংরক্ষিত হবে)</label>
                    <input type="file" id="logoUpload" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
                </div>

                <!-- Download Button -->
                <button id="downloadBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-lg transition shadow-md cursor-pointer mt-2">
                    ফটো কার্ড ডাউনলোড করুন (PNG)
                </button>
            </div>

            <!-- Live Preview -->
            <div class="flex flex-col items-center justify-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-sm font-medium text-slate-400 mb-3">লাইভ প্রিভিউ</h2>
                <div class="w-full max-w-[360px] aspect-square shadow-2xl rounded-lg overflow-hidden border border-slate-700">
                    <canvas id="photoCanvas" width="1080" height="1080" class="w-full h-full object-contain"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');

        // Inputs
        const templateSelect = document.getElementById('templateSelect');
        const categoryInput = document.getElementById('categoryInput');
        const titleInput = document.getElementById('titleInput');
        const subtitleInput = document.getElementById('subtitleInput');
        const dateInput = document.getElementById('dateInput');
        const footerInput = document.getElementById('footerInput');
        const logoUpload = document.getElementById('logoUpload');
        const downloadBtn = document.getElementById('downloadBtn');
        const titleLabel = document.getElementById('titleLabel');
        const extraLabel = document.getElementById('extraLabel');

        let logoImage = null;

        // Load saved logo from localStorage if available
        const savedLogo = localStorage.getItem('icab_logo');
        if (savedLogo) {
            logoImage = new Image();
            logoImage.src = savedLogo;
            logoImage.onload = () => drawCard();
        } else {
            drawCard();
        }

        // Handle logo upload and save to localStorage
        logoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    localStorage.setItem('icab_logo', event.target.result);
                    logoImage = new Image();
                    logoImage.src = event.target.result;
                    logoImage.onload = () => drawCard();
                };
                reader.readAsDataURL(file);
            }
        });

        // Dynamic labels based on template change
        templateSelect.addEventListener('change', function() {
            const val = this.value;
            if (val === 'quote') {
                titleLabel.innerText = 'বাণী বা উক্তির টেক্সট';
                extraLabel.innerText = 'বক্তার নাম ও পদবি (যেমন: ড. জন ক্যান্ডি - প্রেসিডেন্ট)';
                if(categoryInput.value === 'প্রেস বিজ্ঞপ্তি') categoryInput.value = 'বিশেষ বাণী';
            } else if (val === 'breaking') {
                titleLabel.innerText = 'ব্রেকিং নিউজ শিরোনাম';
                extraLabel.innerText = 'বিস্তারিত সংক্ষিপ্ত বিবরণ';
                if(categoryInput.value === 'বিশেষ বাণী' || categoryInput.value === 'প্রেস বিজ্ঞপ্তি') categoryInput.value = 'ব্রেকিং নিউজ';
            } else if (val === 'notice') {
                titleLabel.innerText = 'নোটিশের শিরোনাম বা বিষয়';
                extraLabel.innerText = 'গুরুত্বপূর্ণ নির্দেশাবলী বা সময়';
                categoryInput.value = 'সংশোধনী নোটিশ';
            } else {
                titleLabel.innerText = 'প্রধান শিরোনাম / মূল বার্তা';
                extraLabel.innerText = 'ছোট বিবরণ বা হাইলাইট';
                categoryInput.value = 'প্রেস বিজ্ঞপ্তি';
            }
            drawCard();
        });

        // Event listeners for real-time update
        [categoryInput, titleInput, subtitleInput, dateInput, footerInput].forEach(input => {
            input.addEventListener('input', drawCard);
        });

        // Multi-line and auto-wrap text renderer
        function drawMultiLineText(context, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let currentY = y;
            for (let p = 0; p < paragraphs.length; p++) {
                currentY = drawParagraph(context, paragraphs[p], x, currentY, maxWidth, lineHeight);
            }
            return currentY;
        }

        function drawParagraph(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            if (text.trim() === '') {
                return currentY + lineHeight;
            }

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
            return currentY + lineHeight;
        }

        function drawCard() {
            const template = templateSelect.value;

            if (template === 'breaking') {
                drawBreakingNewsCard();
            } else if (template === 'quote') {
                drawQuoteCard();
            } else if (template === 'notice') {
                drawNoticeCard();
            } else {
                drawPressReleaseCard();
            }
        }

        // 1. Press Release Template
        function drawPressReleaseCard() {
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#0a192f');
            bgGrad.addColorStop(0.5, '#1e293b');
            bgGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Decorative shapes
            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
            ctx.beginPath();
            ctx.arc(950, 120, 250, 0, Math.PI * 2);
            ctx.fill();

            // Top Header Bar
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.fillRect(0, 0, 1080, 140);
            
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(0, 0, 1080, 12);

            drawLogoHeader();

            // Category Badge
            const categoryText = categoryInput.value || 'আপডেট';
            ctx.font = 'bold 28px "Hind Siliguri", sans-serif';
            const catWidth = ctx.measureText(categoryText).width + 50;
            
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.roundRect(60, 180, catWidth, 55, 12);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.fillText(categoryText, 85, 218);

            // Date
            ctx.fillStyle = '#94a3b8';
            ctx.font = '26px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateInput.value, 1020, 218);
            ctx.textAlign = 'left';

            // Divider Line
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(60, 260);
            ctx.lineTo(1020, 260);
            ctx.stroke();

            // Main Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, titleInput.value, 60, 340, 960, 68);

            // Subtitle Box
            ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
            ctx.beginPath();
            ctx.roundRect(60, 730, 960, 135, 16);
            ctx.fill();

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(60, 730, 10, 135);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '28px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, subtitleInput.value, 90, 775, 900, 40);

            drawFooter();
        }

        // 2. Breaking News Template
        function drawBreakingNewsCard() {
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#450a0a');
            bgGrad.addColorStop(0.5, '#1e1b4b');
            bgGrad.addColorStop(1, '#09090b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Red glow accent
            ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
            ctx.beginPath();
            ctx.arc(540, 540, 450, 0, Math.PI * 2);
            ctx.fill();

            // Top Header Bar
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(0, 0, 1080, 140);
            
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(0, 0, 1080, 12);

            drawLogoHeader();

            // Breaking Banner
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.roundRect(60, 180, 280, 55, 8);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Hind Siliguri", sans-serif';
            ctx.fillText('🔴 ' + (categoryInput.value || 'ব্রেকিং নিউজ'), 80, 218);

            // Date
            ctx.fillStyle = '#94a3b8';
            ctx.font = '26px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateInput.value, 1020, 218);
            ctx.textAlign = 'left';

            // Main Headline
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 54px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, titleInput.value, 60, 320, 960, 72);

            // Highlight bar & details
            ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
            ctx.beginPath();
            ctx.roundRect(60, 740, 960, 130, 16);
            ctx.fill();

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(60, 740, 10, 130);

            ctx.fillStyle = '#fca5a5';
            ctx.font = '30px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, subtitleInput.value, 90, 790, 900, 42);

            drawFooter();
        }

        // 3. Quote Card Template
        function drawQuoteCard() {
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#172554');
            bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Giant quotation mark watermark
            ctx.fillStyle = 'rgba(245, 158, 11, 0.08)';
            ctx.font = 'bold 400px Georgia, serif';
            ctx.fillText('“', 60, 450);

            // Top Header Bar
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.fillRect(0, 0, 1080, 140);
            
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(0, 0, 1080, 12);

            drawLogoHeader();

            // Category badge
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.roundRect(60, 180, 200, 50, 10);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 24px "Hind Siliguri", sans-serif';
            ctx.fillText(categoryInput.value || 'বিশেষ বাণী', 85, 215);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '26px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateInput.value, 1020, 215);
            ctx.textAlign = 'left';

            // Quote Text (Centered-ish or nicely padded)
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 48px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, '“ ' + titleInput.value + ' ”', 60, 360, 960, 70);

            // Speaker / Subtitle Box at bottom
            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
            ctx.beginPath();
            ctx.roundRect(60, 720, 960, 140, 16);
            ctx.fill();

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(60, 720, 10, 140);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 32px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, subtitleInput.value, 90, 785, 900, 45);

            drawFooter();
        }

        // 4. Notice & Event Template
        function drawNoticeCard() {
            const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
            bgGrad.addColorStop(0, '#0f766e');
            bgGrad.addColorStop(0.5, '#134e4a');
            bgGrad.addColorStop(1, '#042f2e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1080);

            // Top Header Bar
            ctx.fillStyle = 'rgba(6, 78, 59, 0.9)';
            ctx.fillRect(0, 0, 1080, 140);
            
            ctx.fillStyle = '#2dd4bf';
            ctx.fillRect(0, 0, 1080, 12);

            drawLogoHeader();

            // Notice Badge
            ctx.fillStyle = '#2dd4bf';
            ctx.beginPath();
            ctx.roundRect(60, 180, 240, 55, 10);
            ctx.fill();

            ctx.fillStyle = '#042f2e';
            ctx.font = 'bold 26px "Hind Siliguri", sans-serif';
            ctx.fillText(categoryInput.value || 'নোটিশ বোর্ড', 85, 218);

            ctx.fillStyle = '#99f6e4';
            ctx.font = '26px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateInput.value, 1020, 218);
            ctx.textAlign = 'left';

            // Divider
            ctx.strokeStyle = '#115e59';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(60, 260);
            ctx.lineTo(1020, 260);
            ctx.stroke();

            // Notice Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, titleInput.value, 60, 340, 960, 68);

            // Notice Box
            ctx.fillStyle = 'rgba(20, 83, 75, 0.7)';
            ctx.beginPath();
            ctx.roundRect(60, 730, 960, 135, 16);
            ctx.fill();

            ctx.fillStyle = '#2dd4bf';
            ctx.fillRect(60, 730, 10, 135);

            ctx.fillStyle = '#ccfbf1';
            ctx.font = '28px "Hind Siliguri", sans-serif';
            drawMultiLineText(ctx, subtitleInput.value, 90, 775, 900, 40);

            drawFooter();
        }

        // Helper: Logo header
        function drawLogoHeader() {
            if (logoImage) {
                const logoSize = 100;
                ctx.drawImage(logoImage, 60, 30, logoSize, logoSize);
            } else {
                ctx.fillStyle = '#334155';
                ctx.fillRect(60, 30, 100, 100);
                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 24px "Hind Siliguri", sans-serif';
                ctx.fillText('LOGO', 75, 88);
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px "Hind Siliguri", sans-serif';
            ctx.fillText('ICAB Media Wing', 185, 80);

            ctx.fillStyle = '#f59e0b';
            ctx.font = '24px "Hind Siliguri", sans-serif';
            ctx.fillText('Official Announcement & News Update', 185, 115);
        }

        // Helper: Footer
        function drawFooter() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 980, 1080, 100);

            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 26px "Hind Siliguri", sans-serif';
            ctx.fillText(footerInput.value, 60, 1038);

            ctx.fillStyle = '#334155';
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.arc(950 + (i * 25), 1038, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Download Action
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'icab-media-card-' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
