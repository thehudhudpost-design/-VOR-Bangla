<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Of Rising Bangla - ফটো কার্ড জেনারেটর</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #334155;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }

        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--panel-bg); border-radius: 10px; border-bottom: 3px solid var(--primary); }
        header h1 { color: var(--primary); font-size: 26px; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 13px; }

        /* Style Switcher Tabs */
        .style-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border: 2px solid #475569; background: #1e293b;
            color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px;
        }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .panel { background: var(--panel-bg); padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: 600; }
        
        input[type="text"], textarea, select, input[type="color"], input[type="range"] {
            width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #475569; background: var(--input-bg); color: #fff; outline: none; font-size: 14px;
        }

        .row-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-download {
            width: 100%; padding: 14px; border: none; border-radius: 8px; background: #22c55e;
            color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s;
        }
        .btn-download:hover { background: #16a34a; }

        .preview-area { display: flex; flex-direction: column; align-items: center; position: sticky; top: 20px; }
        canvas { max-width: 100%; height: auto; border: 2px solid #334155; border-radius: 12px; background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <h1>𝐕𝐨𝐢𝐜𝐞 𝐎𝐟 𝐑𝐢𝐬𝐢𝐧𝐠 𝐁𝐚𝐧𝐠𝐥𝐚</h1>
        <p>প্রফেশনাল নিউজ ফটো কার্ড ও কাস্টম এডিটর</p>
    </header>

    <div class="container">
        <!-- কন্ট্রোল প্যানেল -->
        <div class="panel">
            <!-- মোড সিলেকশন ট্যাব -->
            <div class="style-tabs">
                <button class="tab-btn active" id="btnMode1" onclick="setDesignMode(1)">📌 ১৫ টেমপ্লেট মোড</button>
                <button class="tab-btn" id="btnMode2" onclick="setDesignMode(2)">🎨 কাস্টম এডিটর</button>
            </div>

            <!-- টেমপ্লেট ড্রপডাউন (মোড ১) -->
            <div class="form-group" id="templateGroup">
                <label for="templateSelect">ডিজাইন টেমপ্লেট:</label>
                <select id="templateSelect" onchange="drawCard()">
                    <option value="1">১. ব্রেকিং নিউজ (Breaking News)</option>
                    <option value="2" selected>২. সাধারণ নিউজ (Standard News)</option>
                    <option value="3">৩. উক্তি / কোট কার্ড (Quote)</option>
                    <option value="4">৪. শোক সংবাদ (Condolence)</option>
                    <option value="5">৫. খেলাধুলা (Sports Special)</option>
                    <option value="6">৬. জনমত পোল (Opinion Poll)</option>
                    <option value="7">৭. জরুরি সতর্কতা (Alert/Warning)</option>
                    <option value="8">৮. অর্থনীতি ও শেয়ারবাজার (Business)</option>
                    <option value="9">৯. আন্তর্জাতিক সংবাদ (International)</option>
                    <option value="10">১০. বিনোদন ও গ্ল্যামার (Entertainment)</option>
                    <option value="11">১১. রাজনীতি (Politics Special)</option>
                    <option value="12">১২. আবহাওয়া বার্তা (Weather Update)</option>
                    <option value="13">১৩. শুভেচ্ছা ও জন্মদিন (Greetings)</option>
                    <option value="14">১৪. ইতিহাসে আজকের দিন (History)</option>
                    <option value="15">১৫. ফ্যাক্ট চেক (Fact Check)</option>
                </select>
            </div>

            <!-- কাস্টম কালার ও ফন্ট কন্ট্রোল (মোড ২) -->
            <div id="customControls" style="display: none;">
                <div class="row-group">
                    <div class="form-group">
                        <label for="themeColor">থিম কালার:</label>
                        <input type="color" id="themeColor" value="#e50914" oninput="drawCard()">
                    </div>
                    <div class="form-group">
                        <label for="fontSize">ফন্ট সাইজ: <span id="fontVal">44</span>px</label>
                        <input type="range" id="fontSize" min="30" max="60" value="44" oninput="document.getElementById('fontVal').innerText=this.value; drawCard()">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="category">ক্যাটাগরি / ট্যাগ:</label>
                <input type="text" id="category" value="জাতীয়" oninput="drawCard()">
            </div>

            <div class="form-group">
                <label for="headline">সংবাদের শিরোনাম বা উক্তি:</label>
                <textarea id="headline" rows="3" oninput="drawCard()">ফাহিম স্টাইল ও ১৫টি টেমপ্লেট নিয়ে আপডেট সম্পন্ন হয়েছে।</textarea>
            </div>

            <div class="form-group" id="subheadBox">
                <label for="subhead">সাব-হেডলাইন / বক্তার নাম:</label>
                <input type="text" id="subhead" value="বিশেষ প্রতিনিধি" oninput="drawCard()">
            </div>

            <!-- ইমেজ জুম কন্ট্রোল -->
            <div class="form-group">
                <label for="imgZoom">ছবির সাইজ/জুম: <span id="zoomVal">1.0</span>x</label>
                <input type="range" id="imgZoom" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('zoomVal').innerText=this.value; drawCard()">
            </div>

            <div class="form-group">
                <label for="bgImage">সংবাদের মূল ছবি আপলোড করুন:</label>
                <input type="file" id="bgImage" accept="image/*">
            </div>

            <div class="form-group">
                <label for="logoImage">লোগো আপলোড (PNG):</label>
                <input type="file" id="logoImage" accept="image/*">
            </div>

            <button class="btn-download" onclick="downloadCard()">ফটো কার্ড ডাউনলোড (PNG)</button>
        </div>

        <!-- প্রিভিউ এরিয়া -->
        <div class="panel preview-area">
            <h2 id="previewTitle" style="font-size: 16px; margin-bottom: 15px; color: #38bdf8;">কার্ড প্রিভিউ (4:5 Ratio)</h2>
            <canvas id="cardCanvas" width="1080" height="1350"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        
        let loadedImg = null;
        let loadedLogo = null;
        let activeDesignMode = 1;

        function setDesignMode(mode) {
            activeDesignMode = mode;
            document.getElementById('btnMode1').classList.toggle('active', mode === 1);
            document.getElementById('btnMode2').classList.toggle('active', mode === 2);
            document.getElementById('templateGroup').style.display = mode === 1 ? 'block' : 'none';
            document.getElementById('customControls').style.display = mode === 2 ? 'block' : 'none';
            drawCard();
        }

        document.getElementById('bgImage').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                loadedImg = new Image();
                loadedImg.onload = drawCard;
                loadedImg.src = event.target.result;
            }
            if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('logoImage').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                loadedLogo = new Image();
                loadedLogo.onload = drawCard;
                loadedLogo.src = event.target.result;
            }
            if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        function drawCard() {
            const category = document.getElementById('category').value;
            const headline = document.getElementById('headline').value;
            const subhead = document.getElementById('subhead').value;
            const templateId = document.getElementById('templateSelect').value;
            const themeColor = document.getElementById('themeColor').value;
            const fontSize = parseInt(document.getElementById('fontSize').value);
            const zoom = parseFloat(document.getElementById('imgZoom').value);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (loadedImg) {
                ctx.save();
                ctx.translate(1080 / 2, 800 / 2);
                ctx.scale(zoom, zoom);
                ctx.drawImage(loadedImg, -1080 / 2, -800 / 2, 1080, 800);
                ctx.restore();
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, 1080, 800);
                ctx.fillStyle = '#64748b';
                ctx.font = '36px Arial';
                ctx.fillText('ছবি নির্বাচন করুন', 420, 400);
            }

            let grad = ctx.createLinearGradient(0, 550, 0, 1350);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.35, 'rgba(0,0,0,0.9)');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 550, 1080, 800);

            let accent = '#e50914';
            let fSizeToUse = 44;

            if (activeDesignMode === 1) {
                if(templateId === '3') accent = '#ff9800';
                else if(templateId === '5') accent = '#00c853';
                else if(templateId === '7') accent = '#ffd600';
                else if(templateId === '8') accent = '#00e676';
                else if(templateId === '9') accent = '#29b6f6';
                else if(templateId === '10') accent = '#e91e63';
                fSizeToUse = 44;
            } else {
                accent = themeColor;
                fSizeToUse = fontSize;
            }

            if (category) {
                ctx.fillStyle = accent;
                ctx.fillRect(60, 770, 220, 50);
                ctx.fillStyle = (activeDesignMode === 1 && templateId === '7') ? '#000' : '#ffffff';
                ctx.font = 'bold 26px Arial';
                ctx.fillText(category, 80, 805);
            }

            if (activeDesignMode === 1 && templateId === '3') {
                ctx.fillStyle = 'rgba(255, 152, 0, 0.4)';
                ctx.font = 'bold 150px Georgia';
                ctx.fillText('“', 45, 870);
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${fSizeToUse}px Arial`;
            wrapText(ctx, headline, 60, 880, 960, fSizeToUse + 16);

            if (subhead) {
                ctx.fillStyle = (activeDesignMode === 1 && templateId === '3') ? '#ffcc80' : '#cbd5e1';
                ctx.font = '28px Arial';
                wrapText(ctx, subhead, 60, 1120, 960, 40);
            }

            ctx.fillStyle = accent;
            ctx.fillRect(0, 1270, 1080, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('𝐕𝐨𝐢𝐜𝐞 𝐎𝐟 𝐑𝐢𝐬𝐢𝐧𝐠 𝐁𝐚𝐧𝐠𝐥𝐚', 60, 1320);

            if (loadedLogo) {
                ctx.drawImage(loadedLogo, 920, 1280, 100, 60);
            }
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function downloadCard() {
            const link = document.createElement('a');
            link.download = 'news-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        drawCard();
    </script>
</body>
</html>
