<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Of Rising Bangla - ফটো কার্ড ও ভিডিও জেনারেটর</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #121212;
            --panel-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --text: #ffffff;
            --accent: #00e676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }

        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--panel-bg); border-radius: 10px; border-bottom: 3px solid var(--primary); }
        header h1 { color: var(--primary); font-size: 26px; margin-bottom: 5px; }
        header p { color: #aaa; font-size: 13px; }

        .app-container { max-width: 1250px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
        @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } }

        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .mode-switch { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn {
            flex: 1; padding: 12px; border: 1px solid var(--primary); background: transparent;
            color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .mode-btn.active { background: var(--primary); }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #ccc; }
        
        input[type="text"], textarea, select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: var(--input-bg); color: #fff; outline: none; font-size: 14px;
        }

        .btn-action {
            width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary);
            color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #17a2b8; }

        .preview-box { display: flex; flex-direction: column; align-items: center; position: sticky; top: 15px; }
        canvas { max-width: 100%; height: auto; border: 2px solid #333; border-radius: 10px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        #statusText { margin-top: 12px; font-size: 13px; color: #ffca28; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>𝐕𝐨𝐢𝐜𝐞 𝐎𝐟 𝐑𝐢𝐬𝐢𝐧𝐠 𝐁𝐚𝐧𝐠𝐥𝐚</h1>
        <p>ফটো কার্ড ও ভিডিও রিল জেনারেটর</p>
    </header>

    <div class="app-container">
        <!-- Control Panel -->
        <div class="panel">
            <div class="mode-switch">
                <button class="mode-btn active" id="btnCardMode" onclick="setMode('card')">ফটো কার্ড মোড (4:5)</button>
                <button class="mode-btn" id="btnReelMode" onclick="setMode('reel')">রিল ভিডিও মোড (9:16)</button>
            </div>

            <!-- Template Selector -->
            <div class="form-group" id="templateGroup">
                <label for="templateSelect">ডিজাইন টেমপ্লেট (১৫টি অপশন):</label>
                <select id="templateSelect" onchange="updateCanvas()">
                    <option value="1">১. ব্রেকিং নিউজ (Breaking News)</option>
                    <option value="2" selected>২. সাধারণ নিউজ (Standard News)</option>
                    <option value="3">৩. উক্তি / কোট কার্ড (Quote)</option>
                    <option value="4">৪. শোক সংবাদ (Condolence)</option>
                    <option value="5">৫. খেলাধুলা (Sports Special)</option>
                    <option value="6">৬. জনমত পোল (Opinion Poll)</option>
                    <option value="7">৭. জরুরি সতর্কতা (Alert/Warning)</option>
                    <option value="8">৮. অর্থনীতি ও শেয়ারবাজার (Business)</option>
                    <option value="9">৯. আন্তর্জাতিক সংবাদ (International)</option>
                    <option value="10">১০. বিনোদন ও গ্ল্যামার (Entertainment)</option>
                    <option value="11">১১. রাজনীতি (Politics Special)</option>
                    <option value="12">১২. আবহাওয়া বার্তা (Weather Update)</option>
                    <option value="13">১৩. শুভেচ্ছা ও জন্মদিন (Greetings)</option>
                    <option value="14">১৪. ইতিহাসে আজকের দিন (History)</option>
                    <option value="15">১৫. ফ্যাক্ট চেক (Fact Check)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">ক্যাটাগরি / ট্যাগ:</label>
                <input type="text" id="category" value="জাতীয়" oninput="updateCanvas()">
            </div>

            <div class="form-group">
                <label for="headline">সংবাদের শিরোনাম:</label>
                <textarea id="headline" rows="3" oninput="updateCanvas()">ভিডিও রিল জেনারেটর সিস্টেম আপডেট করা হয়েছে!</textarea>
            </div>

            <div class="form-group" id="subheadGroup">
                <label for="subhead">সাব-হেডলাইন / স্পিকার:</label>
                <input type="text" id="subhead" value="সহজেই রিল ভিডিও তৈরি করুন" oninput="updateCanvas()">
            </div>

            <div class="form-group">
                <label for="bgImage">ছবি আপলোড (একাধিক ছবি সিলেক্ট করা যাবে):</label>
                <input type="file" id="bgImage" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label for="logoImage">লোগো আপলোড:</label>
                <input type="file" id="logoImage" accept="image/*">
            </div>

            <!-- Action Buttons -->
            <div id="cardActions">
                <button class="btn-action btn-green" onclick="downloadPhotoCard()">ফটো কার্ড ডাউনলোড (PNG)</button>
            </div>

            <div id="reelActions" style="display: none;">
                <button class="btn-action btn-blue" onclick="playReelPreview()">▶️ রিল প্রিভিউ প্লে করুন</button>
                <button class="btn-action btn-green" onclick="stopReelPreview()">⏹️ প্রিভিউ বন্ধ করুন</button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="panel preview-box">
            <div class="section-title" id="previewTitle">ফটো কার্ড প্রিভিউ (4:5)</div>
            <canvas id="mainCanvas" width="1080" height="1350"></canvas>
            <p id="statusText">ছবি আপলোড করে প্রিভিউ বা ডাউনলোড করুন।</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let currentMode = 'card';
        let loadedImages = [];
        let uploadedLogo = null;
        let animInterval = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnCardMode').classList.toggle('active', mode === 'card');
            document.getElementById('btnReelMode').classList.toggle('active', mode === 'reel');
            
            document.getElementById('cardActions').style.display = mode === 'card' ? 'block' : 'none';
            document.getElementById('reelActions').style.display = mode === 'reel' ? 'block' : 'none';
            document.getElementById('subheadGroup').style.display = mode === 'card' ? 'block' : 'none';
            document.getElementById('templateGroup').style.display = mode === 'card' ? 'block' : 'none';

            if(mode === 'card') {
                canvas.width = 1080;
                canvas.height = 1350;
                document.getElementById('previewTitle').innerText = 'ফটো কার্ড প্রিভিউ (4:5)';
            } else {
                canvas.width = 1080;
                canvas.height = 1920;
                document.getElementById('previewTitle').innerText = 'রিল ভিডিও প্রিভিউ (9:16)';
            }
            clearInterval(animInterval);
            updateCanvas();
        }

        document.getElementById('bgImage').addEventListener('change', function(e) {
            loadedImages = [];
            const files = Array.from(e.target.files);
            let count = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        count++;
                        if(count === files.length) updateCanvas();
                    };
                    img.src = event.target.result;
                    loadedImages.push(img);
                };
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('logoImage').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedLogo = new Image();
                uploadedLogo.onload = updateCanvas;
                uploadedLogo.src = event.target.result;
            }
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        function drawCanvasFrame(imgIdx = 0, zoom = 1.0) {
            const templateId = document.getElementById('templateSelect').value;
            const imgHeight = currentMode === 'card' ? 800 : 1200;

            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (loadedImages.length > 0 && loadedImages[imgIdx]) {
                ctx.save();
                if(zoom > 1.0) {
                    ctx.translate(canvas.width / 2, imgHeight / 2);
                    ctx.scale(zoom, zoom);
                    ctx.drawImage(loadedImages[imgIdx], -canvas.width / 2, -imgHeight / 2, canvas.width, imgHeight);
                } else {
                    ctx.drawImage(loadedImages[imgIdx], 0, 0, canvas.width, imgHeight);
                }
                ctx.restore();
            } else {
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, canvas.width, imgHeight);
                ctx.fillStyle = '#666';
                ctx.font = '36px Arial';
                ctx.fillText('ছবি আপলোড করুন', canvas.width / 2 - 120, imgHeight / 2);
            }

            if(currentMode === 'card') {
                applyTemplateOverlay(templateId, imgHeight);
            } else {
                applyReelOverlay();
            }

            drawFooter(templateId);
        }

        function applyTemplateOverlay(templateId, imgHeight) {
            const headline = document.getElementById('headline').value;
            const subhead = document.getElementById('subhead').value;
            const category = document.getElementById('category').value;
            const headY = 880;

            let grad = ctx.createLinearGradient(0, imgHeight - 250, 0, canvas.height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.3, 'rgba(0,0,0,0.85)');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, imgHeight - 250, canvas.width, canvas.height - (imgHeight - 250));

            if(category) {
                ctx.fillStyle = '#e50914';
                ctx.fillRect(60, 780, 220, 48);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 26px Arial';
                ctx.fillText(category, 80, 814);
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px Arial';
            wrapText(ctx, headline, 60, headY, 960, 58);

            if(subhead) {
                ctx.fillStyle = '#d1d1d1';
                ctx.font = '28px Arial';
                wrapText(ctx, subhead, 60, 1110, 960, 40);
            }
        }

        function applyReelOverlay() {
            const headline = document.getElementById('headline').value;
            const category = document.getElementById('category').value;

            let grad = ctx.createLinearGradient(0, 1000, 0, 1920);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.4, 'rgba(0,0,0,0.95)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 1000, 1080, 920);

            ctx.fillStyle = '#00e676';
            ctx.fillRect(60, 1380, 240, 55);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 30px Arial';
            ctx.fillText(category || 'ব্রেকিং নিউজ', 80, 1418);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Arial';
            wrapText(ctx, headline, 60, 1490, 960, 60);
        }

        function drawFooter(templateId) {
            const footerY = currentMode === 'card' ? 1270 : 1840;
            ctx.fillStyle = '#e50914';
            ctx.fillRect(0, footerY, 1080, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('𝐕𝐨𝐢𝐜𝐞 𝐎𝐟 𝐑𝐢𝐬𝐢𝐧𝐠 𝐁𝐚𝐧𝐠𝐥𝐚', 60, footerY + 50);

            if(uploadedLogo) {
                ctx.drawImage(uploadedLogo, 920, footerY + 10, 100, 60);
            }
        }

        function updateCanvas() {
            clearInterval(animInterval);
            drawCanvasFrame(0, 1.0);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function downloadPhotoCard() {
            const link = document.createElement('a');
            link.download = 'news-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function playReelPreview() {
            if(loadedImages.length === 0) {
                alert('অনুগ্রহ করে অন্তত একটি ছবি সিলেক্ট করুন!');
                return;
            }
            clearInterval(animInterval);

            let step = 0;
            let imgIdx = 0;
            let zoom = 1.0;

            document.getElementById('statusText').innerText = "রিল প্রিভিউ চলছে...";

            animInterval = setInterval(() => {
                step++;
                zoom += 0.0006;
                drawCanvasFrame(imgIdx, zoom);

                if(step % 120 === 0) {
                    imgIdx = (imgIdx + 1) % loadedImages.length;
                    zoom = 1.0;
                }
            }, 33);
        }

        function stopReelPreview() {
            clearInterval(animInterval);
            updateCanvas();
            document.getElementById('statusText').innerText = "প্রিভিউ বন্ধ করা হয়েছে।";
        }

        setMode('card');
    </script>
</body>
</html>
